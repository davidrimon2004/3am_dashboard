<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خطة القراءة اليومية | خيمة الاجتماع</title>
    
    <!-- IBM Plex Sans Arabic -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-parchment-100 dark:bg-stone-950 text-stone-800 dark:text-stone-100 min-h-screen font-sans pb-16 selection:bg-tabernacle-gold selection:text-white">

    <!-- Decorative Top Hanging Border -->
    <div class="h-4 w-full tabernacle-hangings-border"></div>

    <div class="max-w-6xl mx-auto px-4 md:px-8 mt-6 relative" id="app">
        <!-- Menorah Watermark -->
        <div class="hidden xl:block absolute -left-16 top-48 w-12 opacity-15 pointer-events-none text-tabernacle-gold">
            <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M50 15v70M20 30c0 30 30 35 30 35M80 30c0 30-30 35-30 35M32 40c0 20 18 23 18 23M68 40c0 20-18 23-18 23M42 50s8 5 8 5M58 50s-8 5-8 5M12 85h76M30 85v-5h40v5" />
            </svg>
        </div>

        <!-- HEADER -->
        <header class="tabernacle-card flex flex-col md:flex-row justify-between items-center bg-parchment-50 dark:bg-stone-900 p-6 rounded-2xl border-2 border-tabernacle-gold/30 shadow-md mb-8 gap-4 relative overflow-hidden">
            <div class="deco-corner-top-right"></div>
            <div class="deco-corner-bottom-left"></div>

            <div class="flex items-center gap-4 relative z-10">
                <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-tabernacle-gold to-amber-700 flex items-center justify-center text-white shadow-lg border border-tabernacle-gold/50">
                    <svg class="w-10 h-10" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="2.5">
                        <path d="M10 80h80M50 20L15 70h70L50 20z" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M42 45l8-10 8 10M50 20v60" stroke-opacity="0.5"/>
                        <path d="M35 70l15-25 15 25" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <div>
                    <h1 class="text-2xl font-bold text-stone-900 dark:text-amber-100 flex items-center gap-2">
                        خطة القراءة اليومية
                        <span class="text-sm font-normal text-tabernacle-gold dark:text-amber-400 bg-tabernacle-gold/10 px-2 py-0.5 rounded border border-tabernacle-gold/20 font-serif">خيمة الاجتماع</span>
                    </h1>
                    <p class="text-sm text-stone-600 dark:text-stone-400 font-light">مدارس احد عام 2027</p>
                </div>
            </div>

            <!-- Global Progress Tracker & Dark Mode Toggle -->
            <div class="flex flex-col md:flex-row items-center gap-5 w-full md:w-auto relative z-10">
                <div class="w-full md:w-72">
                    <div class="flex justify-between items-center mb-2">
                        <span id="progress-text" class="text-xs font-bold text-stone-700 dark:text-stone-300">٠ / ٠ إصحاح مكتمل</span>
                        <span id="progress-percent" class="px-2 py-0.5 rounded-md text-xs font-bold bg-tabernacle-gold/15 text-tabernacle-gold dark:bg-amber-400/15 dark:text-amber-300 border border-tabernacle-gold/25">0%</span>
                    </div>
                    
                    <!-- Recessed Track with Milestone Ticks -->
                    <div class="relative w-full h-4 bg-parchment-200/80 dark:bg-stone-800 rounded-full border border-tabernacle-gold/30 shadow-inner overflow-hidden">
                        <div class="absolute inset-0 flex justify-evenly pointer-events-none z-10">
                            <span class="w-px h-full bg-tabernacle-gold/15 dark:bg-stone-700/60"></span>
                            <span class="w-px h-full bg-tabernacle-gold/15 dark:bg-stone-700/60"></span>
                            <span class="w-px h-full bg-tabernacle-gold/15 dark:bg-stone-700/60"></span>
                        </div>
                        <div id="progress-bar" class="progress-fill h-full rounded-full transition-all duration-700 ease-out relative" style="width: 0%"></div>
                    </div>
                </div>

                <div class="flex items-center self-end md:self-auto">
                    <button id="dark-mode-toggle" class="p-3 rounded-xl bg-parchment-200 dark:bg-stone-800 text-stone-600 dark:text-amber-300 hover:bg-parchment-300 dark:hover:bg-stone-700 border border-parchment-300 dark:border-stone-700 transition-all shadow" aria-label="تبديل المظهر">
                        <span class="dark:hidden">🌙</span>
                        <span class="hidden dark:inline">☀️</span>
                    </button>
                </div>
            </div>
        </header>

        <!-- Spotlight Section: "Up Next" -->
        <section id="up-next-container" class="tabernacle-card bg-gradient-to-br from-parchment-50 via-amber-50/15 to-parchment-100/50 dark:from-stone-900 dark:via-stone-900/90 dark:to-stone-950 border-2 border-tabernacle-gold/60 dark:border-amber-500/40 p-6 md:p-8 rounded-2xl shadow-xl mb-8 relative overflow-hidden">
            <!-- Tabernacle & Altar SVG Watermarks -->
            <div class="absolute inset-y-0 left-0 w-1/3 opacity-[0.07] dark:opacity-[0.03] pointer-events-none mix-blend-multiply dark:mix-blend-screen hidden md:block">
                <svg class="h-full w-full" viewBox="0 0 100 100" fill="none" stroke="#B45309" stroke-width="1.5">
                    <path d="M10 80 L35 40 L60 80 M10 80 h50 M35 40 v40 M20 60 l30-20 M50 40 L40 80" stroke-dasharray="2 2"/>
                    <path d="M35 40 C30 25, 45 10, 35 5 C25 10, 30 25, 30 35 M32 30 C35 15, 25 15, 30 5" stroke-dasharray="1 1"/>
                </svg>
            </div>
            <div class="absolute inset-y-0 right-0 w-1/3 opacity-[0.07] dark:opacity-[0.03] pointer-events-none mix-blend-multiply dark:mix-blend-screen hidden md:block">
                <svg class="h-full w-full" viewBox="0 0 100 100" fill="none" stroke="#991B1B" stroke-width="1.5">
                    <path d="M20 80 h40 v-20 h-40 z M25 60 l5-10 h20 l5 10 M30 80 v5 M50 80 v5 M25 80 h30"/>
                    <path d="M38 50 c-5-10, 5-20, 0-25 c-5 5, 0 15, -2 25" stroke-dasharray="2 2"/>
                </svg>
            </div>

            <div class="deco-corner-top-right"></div>
            <div class="deco-corner-bottom-left"></div>

            <div class="relative z-10 space-y-5">
                <div class="flex items-center gap-3">
                    <span class="px-3.5 py-1.5 bg-tabernacle-crimson/10 text-tabernacle-crimson dark:bg-red-500/15 dark:text-red-400 rounded-full text-xs font-bold border border-tabernacle-crimson/20">القراءة القادمة</span>
                    <h2 class="text-xl font-bold text-stone-900 dark:text-stone-50 flex items-center gap-2" id="up-next-day">جاري التحميل...</h2>
                    <span class="text-stone-400 dark:text-stone-500 text-xs">|</span>
                    <span class="text-stone-800 dark:text-stone-200 text-base font-bold" id="up-next-date">---</span>
                </div>

                <!-- Main Double Chapters Click/Tap Targets -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="up-next-chapters">
                    <!-- Rendered by JS -->
                </div>
            </div>
        </section>

        <!-- Workspace Filters -->
        <div class="flex items-center justify-between border-b border-tabernacle-gold/20 dark:border-stone-800 pb-4 mb-6">
            <h3 class="font-bold text-lg text-stone-900 dark:text-amber-100 flex items-center gap-2">
                <svg class="w-5 h-5 text-tabernacle-gold" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                </svg>
                رحلة القراءة
            </h3>
            <div class="flex gap-1.5 bg-parchment-200 dark:bg-stone-900 p-1 rounded-xl border border-parchment-300/50 dark:border-stone-800">
                <button id="filter-all" onclick="setFilter('all')" class="px-4 py-1.5 rounded-lg text-sm font-semibold transition-all shadow-sm bg-white text-tabernacle-gold border border-tabernacle-gold/10 dark:bg-stone-800 dark:text-amber-200 dark:border-stone-700">الكل (<span id="count-all">0</span>)</button>
                <button id="filter-remaining" onclick="setFilter('remaining')" class="px-4 py-1.5 rounded-lg text-sm font-medium text-stone-500 dark:text-stone-400 transition-all hover:text-stone-800 dark:hover:text-stone-200">المتبقي (<span id="count-remaining">0</span>)</button>
            </div>
        </div>

        <!-- Reading Grid Layout -->
        <main class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="days-grid">
            <!-- Rendered by JS -->
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
